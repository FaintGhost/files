port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
proxy-groups:
  - name: ➡️节点选择
    type: select
    proxies:
      - 🔄自动测速
  - name: 🔄自动测速
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: OpenAI
    type: select
    proxies:
      - 狮城节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 韩国节点
  - name: 油管视频
    type: select
    proxies:
      - ➡️节点选择
      - 🔄自动测速
      - 狮城节点
      - 香港节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - DIRECT
  - name: 哔哩哔哩
    type: select
    proxies:
      - 全球直连
      - 台湾节点
      - 香港节点
  - name: 国外媒体
    type: select
    proxies:
      - ➡️节点选择
      - 🔄自动测速
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - DIRECT
  - name: 国内媒体
    type: select
    proxies:
      - DIRECT
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
  - name: Google
    type: select
    proxies:
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: WhatsApp
    type: select
    proxies:
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: Linkedin
    type: select
    proxies:
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - ➡️节点选择
      - 🔄自动测速
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 漏网之鱼
    type: select
    proxies:
      - ➡️节点选择
      - 🔄自动测速
      - DIRECT
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
  - name: 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    proxies: []
  - name: 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 狮城节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 韩国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
rule-providers:
  geoip-google:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geoip/google.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: ipcidr
    format: yaml
    size-limit: 0
  geosite-google:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geosite/google.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: domain
    format: yaml
    size-limit: 0
  geosite-openai:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geosite/openai.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: domain
    format: yaml
    size-limit: 0
  geosite-whatsapp:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geosite/whatsapp.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: domain
    format: yaml
    size-limit: 0
  geoip-cn:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geoip/cn.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: ipcidr
    format: yaml
    size-limit: 0
  geosite-private:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geosite/private.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: domain
    format: yaml
    size-limit: 0
  geosite-linkedin:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geosite/linkedin.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: domain
    format: yaml
    size-limit: 0
  geosite-apple:
    type: http
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@refs/heads/meta/geo/geosite/apple.yaml
    interval: 600
    proxy: ➡️节点选择
    behavior: domain
    format: yaml
    size-limit: 0
rules:
  - DOMAIN,sub.novastar.wiki,➡️节点选择
  - DOMAIN,www.novastar.tech,➡️节点选择
  - DOMAIN-SUFFIX,novastar.tech,DIRECT
  - DOMAIN-SUFFIX,novastar.online,DIRECT
  - DOMAIN-SUFFIX,novaops.tech,DIRECT
  - RULE-SET,geoip-google,Google
  - RULE-SET,geosite-google,Google
  - RULE-SET,geosite-openai,OpenAI
  - RULE-SET,geosite-whatsapp,WhatsApp
  - RULE-SET,geosite-linkedin,Linkedin
  - RULE-SET,geosite-apple,Apple
  - RULE-SET,geoip-cn,全球直连
  - RULE-SET,geosite-private,全球直连
  - MATCH,漏网之鱼
