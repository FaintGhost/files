port: 7890
socks-port: 7891
allow-lan: true
mode: rule
ipv6: false
log-level: info
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
proxies: []
proxy-groups:
  - name: ➡️节点选择
    type: select
    proxies:
      - 🔄自动测速
  - name: 🔄自动测速
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: OpenAI
    type: select
    proxies:
      - 狮城节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 韩国节点
  - name: Google
    type: select
    proxies:
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: YouTube
    type: select
    proxies:
      - ➡️节点选择
      - 🔄自动测速
      - 狮城节点
      - 香港节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - DIRECT
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: Microsoft
    type: select
    proxies:
      - ➡️节点选择
      - 🔄自动测速
      - DIRECT
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
  - name: WhatsApp
    type: select
    proxies:
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: Linkedin
    type: select
    proxies:
      - ➡️节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: Teamviewer
    type: select
    proxies:
      - ➡️节点选择
      - DIRECT
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
  - name: 哔哩哔哩
    type: select
    proxies:
      - 全球直连
      - 台湾节点
      - 香港节点
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - ➡️节点选择
      - 🔄自动测速
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    proxies: []
  - name: 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 狮城节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 韩国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
  - name: 漏网之鱼
    type: select
    proxies:
      - ➡️节点选择
      - 🔄自动测速
      - DIRECT
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
