rules:
  - DOMAIN,sub.novastar.wiki,➡️节点选择
  - DOMAIN,www.novastar.tech,➡️节点选择
  - DOMAIN-SUFFIX,novastar.tech,DIRECT
  - DOMAIN-SUFFIX,novastar.online,DIRECT
  - DOMAIN-SUFFIX,novaops.tech,DIRECT
  - IP-CIDR,172.16.91.11/32,DIRECT,no-resolve
  - RULE-SET,geoip-google,Google
  - RULE-SET,geosite-google,Google
  - RULE-SET,geosite-youtube,YouTube
  - RULE-SET,geosite-openai,OpenAI
  - RULE-SET,geosite-whatsapp,WhatsApp
  - RULE-SET,geosite-linkedin,Linkedin
  - RULE-SET,geosite-apple,Apple
  - RULE-SET,geosite-onedrive,Microsoft
  - RULE-SET,geosite-microsoft,Microsoft
  - RULE-SET,geosite-teamviewer,Teamviewer
  - RULE-SET,geosite-bilibili,哔哩哔哩
  - RULE-SET,geoip-cn,全球直连
  - RULE-SET,geosite-private,全球直连
  - RULE-SET,geosite-geolocation-cn,全球直连
  - RULE-SET,geosite-geolocation-!cn,➡️节点选择
  - RULE-SET,geosite-cateogry-ads-all,广告拦截
  - MATCH,漏网之鱼
